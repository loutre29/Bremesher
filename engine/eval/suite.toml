# AutoQuad evaluation suite (DESIGN.md 10.1 and 10.3).
#
# Run:  autoquad batch --suite eval/suite.toml --out results/<milestone> --seeds 0..4
#                      --compare baselines/ --markdown results/<milestone>/summary.md --gate M1
#
# Paths are relative to this file. Gates must hold for seed 0 and for at least
# `seeds_required` of the seeds run (DESIGN 10.2 step 4). Irregular vertex counts use the
# tools/quad_stats.py rules. Per-mesh gates carry the milestone suffix (_m1, _m2); the M0 gates
# only ask for valid all-quad output (DESIGN 11.3).
#
# loop_axis: "all" checks every edge line (both families), "x"/"y"/"z" or "pca" (the largest
# variance axis of the input) checks the circumferential lines about that axis.

[suite]
testdata = "../testdata"
baselines = "../baselines"
seeds = [0, 1, 2, 3, 4]
seeds_required = 4
# The edge CV gate is measured with adaptive 0 (DESIGN 10.3 "Edge CV (adaptive 0)").
adaptive = 0.0
time_limit_s = 60.0

# M0, walking skeleton (DESIGN 11.3): valid all-quad output on every mesh and the perf input,
# SF allowed, no per-mesh quality gates.
[gates.M0]
quad_ratio = 1.0
allow_sf = true
count_err = 0.25
small_time_s = 5.0
perf_time_s = 30.0
vertex_dist_h = 0.3
feature_cover_tol = 1e-6

# M1 global gates (DESIGN 10.3).
[gates.M1]
quad_ratio = 1.0
allow_sf = false
count_err = 0.10
edge_cv_cap = 0.20
angle_dev_vs_qf = true
vertex_dist_h = 0.3
hausdorff_h = 1.0
small_time_s = 5.0
perf_time_s = 30.0
# Feature edges covered by quad edges within 1e-6 (in units of a diagonal of 10).
feature_cover_tol = 1e-6

# M2 global gates (DESIGN 10.3).
[gates.M2]
quad_ratio = 1.0
allow_sf = false
count_err = 0.08
edge_cv_cap = 0.20
angle_dev_vs_qf = true
vertex_dist_h = 0.3
hausdorff_h = 1.0
small_time_s = 5.0
perf_time_s = 20.0
feature_cover_tol = 1e-6

